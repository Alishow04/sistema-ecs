<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Seed · Sistema ECS (uso único)</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <style>
    body { padding: 40px; max-width: 560px; margin: 0 auto; }
    pre { background: var(--bg); padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; }
    button { margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Seed inicial — Sistema ECS</h1>
  <p>Esta página grava as listas iniciais em <code>settings/*</code>.
    Revise os dados antes de executar. Rode apenas para inicializar/atualizar as configurações e,
    depois da implantação, remova este arquivo do ambiente publicado.</p>
  <button id="run" class="btn btn--primary">Rodar seed</button>
  <pre id="log">Aguardando...</pre>

    import { doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const log = document.getElementById('log');
    const write = (msg) => { log.textContent += `\n${msg}`; };

      responsaveis: { list: [

        { code: 'CP', name: 'Cauã Pitz', active: true },
        { code: 'ML', name: 'Murilo Lini', active: true },
      ]},

      vendedores: { list: [
        'ABS',
        'Airton - CAÇ',
        'Alexandre - CTBA',
        'Bruno - CXS',
        'Corporativo AF',
        'Dalton - CG',
        'Danilo C. - SP',
        'Dheison - FLP',
        'Didmar - M. OESTE',
        'Diego - Campinas',
        'Diego - SPIII',
        'Emanuel - SP',
        'Douglas - A. VALE',
        'Filipe - POA',
        'Jaderson - CHA',
        'João Victor - Boiler',
        'Juliano - CRI',
        'Leonardo - BA',
        'Lucas - SBS',
        'Natanael - SP',
        'Olinger - BRU',
        'Otávio - MG',
        'Pasqualini - JVL',
        'Patrick - POA',
        'Pitz - B. VALE',
        'Rafael - Norte SC',
        'Silvano - GO',
        'Tony - MT',
        'Região ABC - SP',
        'Robson - BNU',
        'Rodrigo - JGS',
        'Romeu - CHA',
        'Sidnei - LDN',
        'Vander - PG',
        'Ivan - PA',
        'Ricardo - Rib.Preto',
        'Outros',
      ]},

      produtos: { list: [
        'Válvulas',
        'Reparo Válvulas',
        'Bombas',
        'Reparos Bombas',
        'Atomizador',
        'Reparo Atomizador',
        'Homogeneizador',
        'Reparo Homogeneizador',
        'Trocador',
        'Reparo Trocador',
        'Votator',
        'Reparo Votator',
        'Misturador',
        'Reparo Misturador',
        'APS',
        'Sistemas',
        'PLA',
        'Dúvidas e Outros',
      ]},

      marcas: { list: [
        'APV',
        'Waukesha',
        'SPX',
        'WCB',
        'Outros',
      ]},

      // IMPORTANTE: confirme se esta é a lista final de Filiais/Regiões.
      // O sistema deriva a UF automaticamente a partir deste mapeamento.
      filiais: { list: [
        { name: 'Matriz', state: 'SC' },
        { name: 'Londrina', state: 'PR' },
        { name: 'Curitiba', state: 'PR' },
        { name: 'Belo Horizonte', state: 'MG' },
        { name: 'São Paulo', state: 'SP' },
        { name: 'Goiânia', state: 'GO' },
      ]},
    };

    document.getElementById('run').addEventListener('click', async () => {
      const button = document.getElementById('run');
      button.disabled = true;
      log.textContent = 'Gravando...';

      try {
        for (const [name, value] of Object.entries(data)) {
          await setDoc(doc(db, 'settings', name), value);
          write(`✓ settings/${name} gravado (${value.list.length} itens)`);
        }
        write('\nPronto. Volte para index.html e teste o formulário Novo ECS.');
      } catch (error) {
        console.error(error);
        write(`\nERRO: ${error.message || error}`);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
