<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Seed · Sistema ECS (uso único)</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <style>
    body { padding: 40px; max-width: 560px; margin: 0 auto; }
    pre { background: var(--bg); padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; }
    button { margin-top: 16px; }
  </style>
</head>
<body>
  <h1>Seed inicial — Sistema ECS</h1>
  <p>Esta página grava dados de exemplo em <code>settings/*</code> para você conseguir testar o formulário Novo ECS. <strong>Rode uma única vez</strong> e depois apague este arquivo (ou ajuste os valores primeiro — eles são só um ponto de partida, não a lista real e completa da Fiedler).</p>
  <button id="run" class="btn btn--primary">Rodar seed</button>
  <pre id="log">Aguardando...</pre>

  <script type="module">
    import { db } from './js/firebase-config.js';
    import { doc, setDoc } from 'https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js';

    const log = document.getElementById('log');
    const write = (msg) => { log.textContent += `\n${msg}`; };

    const data = {
      responsaveis: { list: [
        { code: 'AK', name: 'Alison Körtelt', active: true },
        { code: 'CP', name: 'Cauã Pitz', active: true },
        { code: 'ML', name: 'Murilo Lini', active: true },
        { code: 'JG', name: 'Johann Gueths', active: true },
      ]},
      vendedores: { list: [
        'Olinger - BRU',
        // EXEMPLO — substitua pela lista real de vendedores da Fiedler
        'Vendedor Exemplo - POA',
        'Vendedor Exemplo - SP',
      ]},
      produtos: { list: [
        'Válvulas', 'Reparo Válvulas', 'Bombas', 'Reparo Bombas',
        'Homogeneizadores', 'Trocadores de Calor', 'Outros',
      ]},
      marcas: { list: ['APV', 'WCB', 'Bornemann', 'Outros'] },
      // UF amarrado à filial/região — ajuste para o mapeamento real da Fiedler.
      filiais: { list: [
        { name: 'Matriz', state: 'SC' },
        { name: 'Londrina', state: 'PR' },
        { name: 'Curitiba', state: 'PR' },
        { name: 'Belo Horizonte', state: 'MG' },
        { name: 'São Paulo', state: 'SP' },
        { name: 'Goiânia', state: 'GO' },
      ]},
    };

    document.getElementById('run').addEventListener('click', async () => {
      log.textContent = 'Gravando...';
      for (const [name, value] of Object.entries(data)) {
        await setDoc(doc(db, 'settings', name), value);
        write(`✓ settings/${name} gravado (${value.list.length} itens)`);
      }
      write('\nPronto. Volte para index.html e teste o formulário Novo ECS.');
    });
  </script>
</body>
</html>
